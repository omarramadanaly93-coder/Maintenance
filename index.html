<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maintenance board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F1F2EE;--panel:#FFFFFF;--ink:#18242F;--mute:#5B6873;--line:#D3D8D2;--red:#C23B2E;--amber:#D99A00;--green:#2F7D52;--hi:#F2C200;--hi-ink:#18242F;--row:#F7F8F5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181E;--panel:#1A222A;--ink:#E8ECEF;--mute:#9AA6B0;--line:#2C3741;--red:#E5604F;--amber:#F0B429;--green:#4DB37C;--row:#1F2831;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181E;--panel:#1A222A;--ink:#E8ECEF;--mute:#9AA6B0;--line:#2C3741;--red:#E5604F;--amber:#F0B429;--green:#4DB37C;--row:#1F2831;color-scheme:dark}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font:700 34px/1 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;margin:0;letter-spacing:.2px}
.sub{color:var(--mute);margin:4px 0 0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--hi);color:var(--hi-ink);border-color:var(--hi);font-weight:600}
.btn.dng{color:var(--red);border-color:var(--red)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.fleet{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.bar{display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--line);gap:2px}
.seg{border:0;padding:0;cursor:pointer;min-width:0;transition:flex-grow .3s}
.seg.over{background:var(--red)}.seg.soon{background:var(--amber)}.seg.ok{background:var(--green)}
.seg[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:-3px}
.legend{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:12px}
.leg{border:0;background:none;padding:0;cursor:pointer;text-align:left}
.leg b{font:700 38px/1 "Barlow Condensed",Impact,sans-serif;display:block}
.leg span{color:var(--mute)}
.leg.over b{color:var(--red)}.leg.soon b{color:var(--amber)}.leg.ok b{color:var(--green)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters input,.filters select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 10px;min-width:150px}
.filters input{flex:1 1 220px}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:780px}
th{text-align:left;font-weight:600;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--row)}
tr:last-child td{border-bottom:0}
.tag{font:600 18px/1.1 "Barlow Condensed",Impact,sans-serif;display:block}
.dim{color:var(--mute);font-size:13px}
.num{font:600 20px/1 "Barlow Condensed",Impact,sans-serif;white-space:nowrap}
.meter{height:6px;background:var(--line);border-radius:3px;margin-top:6px;min-width:90px;overflow:hidden}
.meter i{display:block;height:100%}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:600;font-size:13px;color:#fff;white-space:nowrap}
.pill.over{background:var(--red)}.pill.soon{background:var(--amber);color:#18242F}.pill.ok{background:var(--green)}
.empty{padding:40px 20px;text-align:center}
.empty h2{font:700 26px/1.1 "Barlow Condensed",Impact,sans-serif;margin:0 0 8px}
.empty p{color:var(--mute);max-width:520px;margin:0 auto 16px}
#note{color:var(--mute);font-size:13px;margin:8px 0 0;min-height:18px}
aside{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(102%);transition:transform .22s;z-index:20}
aside.open{transform:none}
aside h2{font:700 28px/1 "Barlow Condensed",Impact,sans-serif;margin:0}
aside h3{font:600 18px/1 "Barlow Condensed",Impact,sans-serif;margin:22px 0 8px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.grid label{display:block;font-size:13px;color:var(--mute)}
.grid input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;margin-top:2px}
.grid .w{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row label{flex:1 1 110px;font-size:13px;color:var(--mute)}
.row input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;margin-top:2px}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:8px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:40;max-width:90vw}
.sr{position:absolute;left:-9999px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 16px;cursor:pointer;font:600 20px/1 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hi)}
.lnk{border:0;background:none;padding:0;font:600 18px/1.1 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;color:var(--ink);text-decoration:underline;text-decoration-color:var(--hi);text-decoration-thickness:3px;text-underline-offset:3px;cursor:pointer;text-align:left}
.grid select,.grid textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;margin-top:2px;font:inherit}
.brand{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;display:flex;align-items:center}
.brand img{height:56px;width:auto;display:block}
.hdr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero{background-color:#18242F;background-image:var(--hero-img,none);background-size:cover;background-position:center;color:#fff;border-radius:6px 6px 0 0;padding:40px 28px}
.hero h2{font:700 42px/1.05 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;margin:0 0 10px;max-width:620px}
.hero p{margin:0 0 18px;max-width:540px;color:#D5DCE2}
.hero .btn:not(.pri){background:transparent;color:#fff;border-color:#8896A3}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.stripe{height:10px;background:repeating-linear-gradient(135deg,#F2C200 0 16px,#18242F 16px 32px);margin-bottom:14px;border-radius:0 0 6px 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:14px;text-align:left;cursor:pointer}
.tile:hover{border-color:var(--ink)}
.tile b{font:700 42px/1 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;display:block}
.tile span{color:var(--mute)}
.warn{border:1px solid var(--line);border-left:6px solid var(--amber);background:var(--panel);padding:12px 14px;border-radius:6px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.authbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;width:min(380px,100%)}
.authbox h2{font:700 30px/1 "Barlow Condensed",Impact,sans-serif;margin:0 0 6px}
.authbox label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
.authbox input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:2px}
[hidden]{display:none!important}
</style>
</head>

<script>
var $=function(s){return document.querySelector(s)};
var items=[],col=null,loaded=false,sel=null,st='',delArm=false;
var LS='maintenance-board-items';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(v){var n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0}
function slug(s){return String(s).trim().replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,100)}
function fix(i){i.hrs=num(i.hrs);i.last=num(i.last);i.interval=num(i.interval)||250;i.hist=i.hist||[];return i}
function status(i){var r=i.last+i.interval-i.hrs;return{rem:r,s:r<0?'over':r<=50?'soon':'ok'}}
var LABEL={over:'Overdue',soon:'Due soon',ok:'On schedule'};
var fmt=function(n){return Math.round(n).toLocaleString('en-US')};
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3500)}
function note(m){$('#note').textContent=m||''}

/* ---------- Supabase storage ---------- */
var SUPABASE_URL='https://deeowwnpayzrmjbaevfv.supabase.co', SUPABASE_KEY='sb_publishable_ifT79P47_ssOukkrnSlVVw_gjCyz842';
var sb=null,booted='',lastLoad=0;
var toItem=function(r){return{id:r.id,tag:r.tag,serial:r.serial||'',type:r.type||'',make:r.make||'',model:r.model||'',site:r.site||'',area:r.area||'',hrs:+r.hrs,last:+r.last_service,interval:+r.service_interval,hist:r.hist||[]}};
var fromItem=function(i){return{id:i.id,tag:i.tag,serial:i.serial||'',type:i.type||'',make:i.make||'',model:i.model||'',site:i.site||'',area:i.area||'',hrs:i.hrs,last_service:i.last,service_interval:i.interval,hist:i.hist||[]}};
var toReq=function(r){return{id:r.id,no:r.request_no,tag:r.equipment_tag,desc:r.description||'',pri:r.priority,by:r.requested_by||'',date:r.req_date,status:'Open',s:+r.start_meter,e:+r.end_meter,step:r.service_step||0,due:!!r.maintenance_due,job:r.job_no}};
var fromReq=function(o){return{id:o.id,request_no:o.no,equipment_tag:o.tag,description:o.desc||'',priority:o.pri,requested_by:o.by||'',req_date:o.date||today(),start_meter:o.s||0,end_meter:o.e||0,service_step:o.step||0,maintenance_due:!!o.due,job_no:o.job||null}};
var toJob=function(r){return{id:r.id,no:r.job_no,tag:r.equipment_tag,type:r.equipment_type||'',step:r.service_step||0,hrs:+r.hours,date:r.done_date,by:r.done_by||'',parts:r.parts_changed||[],notes:r.notes||'',status:r.status,reqId:r.request_id||''}};
var fromJob=function(o){return{id:o.id,job_no:o.no,equipment_tag:o.tag,equipment_type:o.type||'',service_step:o.step||0,hours:o.hrs,done_date:o.date||today(),done_by:o.by||'',parts_changed:o.parts||[],notes:o.notes||'',status:o.status,request_id:o.reqId||null}};
async function syncParts(i){
  var d=await sb.from('spare_parts').delete().eq('equipment_id',i.id);if(d.error)throw d.error;
  var rows=[];Object.keys(i.parts||{}).forEach(function(st){i.parts[st].forEach(function(l,n){rows.push({equipment_id:i.id,service_step:+st,line_no:n,part_text:l})})});
  for(var k=0;k<rows.length;k+=500){var r=await sb.from('spare_parts').insert(rows.slice(k,k+500));if(r.error)throw r.error}
}
async function put(i){
  try{
    var ex=items.some(function(x){return x.id===i.id}),row=fromItem(i);
    var r=ex?await sb.from('equipment').update(row).eq('id',i.id):await sb.from('equipment').insert(row);
    if(r.error)throw r.error;
    var old=items.find(function(x){return x.id===i.id});
    if(i.parts&&JSON.stringify(i.parts)!==JSON.stringify(old&&old.parts))await syncParts(i);
    var k=items.findIndex(function(x){return x.id===i.id});if(k<0)items.push(i);else items[k]=i;drawAll();
  }catch(e){toast('Could not save: '+(e.message||e))}
}
async function del(id){
  var r=await sb.from('equipment').delete().eq('id',id);
  if(r.error){toast('Only administrators can delete equipment');return}
  items=items.filter(function(x){return x.id!==id});drawAll();
}
async function fetchAll(tb,ord){
  var out=[],n=0;
  for(;;){var r=await sb.from(tb).select('*').order(ord).range(n,n+999);if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<1000)break;n+=1000}
  return out;
}
async function loadAll(){
  try{
    var R=await Promise.all([fetchAll('equipment','id'),fetchAll('spare_parts','id'),fetchAll('maintenance_requests','request_no'),fetchAll('maintenance_logs','job_no')]);
    var pm={};R[1].forEach(function(p){var m=pm[p.equipment_id]=pm[p.equipment_id]||{};(m[p.service_step]=m[p.service_step]||[]).push([p.line_no,p.part_text])});
    items=R[0].map(function(r){var i=toItem(r),m=pm[r.id];if(m){i.parts={};Object.keys(m).forEach(function(st){i.parts[st]=m[st].sort(function(a,b){return a[0]-b[0]}).map(function(x){return x[1]})})}return fix(i)});
    closedMap={};removed={};
    reqs=R[2].map(function(r){if(r.closed_at)closedMap[r.id]={at:r.closed_at};if(r.deleted_at)removed[r.id]={at:r.deleted_at};return toReq(r)});
    jobs=R[3].map(toJob);lastLoad=Date.now();loaded=true;note('');drawAll();
  }catch(e){loaded=true;note('Could not load the data: '+(e.message||e));drawAll()}
}
/* ---------- drawing ---------- */
function filtered(skipSt){
  var q=$('#q').value.toLowerCase(),a=$('#fa').value,t=$('#ft').value,pj=$('#fp').value;
  return items.filter(function(i){
    if(a&&i.area!==a)return false;if(pj&&i.site!==pj)return false;if(t&&i.type!==t)return false;
    if(!skipSt&&st&&status(i).s!==st)return false;
    return !q||[i.tag,i.serial,i.model,i.make,i.site,i.type].join(' ').toLowerCase().indexOf(q)>-1;
  });
}
function drawFleet(){
  var c={over:0,soon:0,ok:0};filtered(true).forEach(function(i){c[status(i).s]++});
  var tot=c.over+c.soon+c.ok;
  if(!tot){$('#fleet').innerHTML='<div class="dim">No machines to show yet.</div>';return}
  var bar='<div class="bar" role="group" aria-label="Filter by status">'+['over','soon','ok'].map(function(k){
    return c[k]?'<button class="seg '+k+'" style="flex:'+c[k]+' 1 0" aria-pressed="'+(st===k)+'" aria-label="'+LABEL[k]+': '+c[k]+'" data-st="'+k+'"></button>':''}).join('')+'</div>';
  var leg='<div class="legend">'+['over','soon','ok'].map(function(k){
    return '<button class="leg '+k+'" data-st="'+k+'"><b>'+c[k]+'</b><span>'+LABEL[k]+'</span></button>'}).join('')+
    '<div><b class="num" style="font-size:38px;display:block">'+tot+'</b><span class="dim">Machines'+(st?' (filtered: '+LABEL[st].toLowerCase()+')':'')+'</span></div></div>';
  $('#fleet').innerHTML=bar+leg;
}
function drawFilters(){
  var a=$('#fa').value,p=$('#fp').value,t=$('#ft').value;
  var uniq=function(list,k){return Array.from(new Set(list.map(function(i){return i[k]}).filter(Boolean))).sort()};
  var areas=uniq(items,'area');if(a&&areas.indexOf(a)<0)a='';
  var inA=items.filter(function(i){return !a||i.area===a}),sites=uniq(inA,'site');if(p&&sites.indexOf(p)<0)p='';
  var inP=inA.filter(function(i){return !p||i.site===p}),types=uniq(inP,'type');if(t&&types.indexOf(t)<0)t='';
  var fill=function(sel,all,vals,cur){$(sel).innerHTML='<option value="">'+all+'</option>'+vals.map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>'}).join('')};
  fill('#fa','All areas',areas,a);fill('#fp','All projects',sites,p);fill('#ft','All equipment types',types,t);
}
function drawTable(){
  var rows=filtered(false).map(function(i){var s=status(i);return{i:i,s:s}}).sort(function(a,b){return a.s.rem-b.s.rem});
  $('#tb').innerHTML=rows.map(function(r){var i=r.i,s=r.s,p=Math.max(0,Math.min(1,s.rem/i.interval))*100;
    var col2=s.s==='over'?'var(--red)':s.s==='soon'?'var(--amber)':'var(--green)';
    return '<tr data-id="'+esc(i.id)+'"><td><button class="sr">Open</button><span class="tag">'+esc(i.tag||i.serial)+'</span><span class="dim">'+esc(i.type)+' · '+esc((i.make+' '+i.model).trim())+'</span></td>'+

  if(r.error){
    var u=await sb.from('maintenance_requests').update({closed_at:null}).eq('id',id).select();
    if(u.error||!u.data||!u.data.length){fail('Could not reopen the request.\nFunction: '+r.error.message+'\nDirect update: '+(u.error?u.error.message:'changed 0 rows'));return}
  }
  var v=await sb.from('maintenance_requests').select('closed_at').eq('id',id).maybeSingle();
  if(v.data&&v.data.closed_at){fail('The server accepted it, but the request is still closed in the database.');return}
  $('#warn').hidden=true;delete closedMap[id];drawAll();if($('#dr').classList.contains('open'))reqView(id);toast('Request reopened');
}
function reqView(id){
  var r=reqs.find(function(x){return x.id===id});if(!r)return;
  var c=closedMap[r.id],row=function(k,v){return '<tr><td class="dim" style="padding:6px 12px 6px 0;border:0;white-space:nowrap">'+k+'</td><td style="padding:6px 0;border:0">'+v+'</td></tr>'};
  openForm('<div class="dh"><h2>Request '+r.no+'</h2><button class="btn" id="fClose">Close</button></div><div style="margin-top:8px">'+reqStatus(r)+'</div>'+
  '<table style="min-width:0;margin-top:10px"><tbody>'+row('Machine',tagLink(r.tag))+row('Requested by',esc(r.by||'Not entered'))+row('Date',esc(r.date))+row('Priority',esc(r.pri))+(r.e||r.s?row('Meters',fmt(r.s)+' to '+fmt(r.e)+' ('+fmt(r.e-r.s)+' h)'):'')+(r.due?row('Service',r.step?fmt(r.step)+' h service':'To be decided'):'')+row('Issue',esc(r.desc||'None'))+'</tbody></table>'+
  '<div class="row" style="margin-top:14px">'+(r.due&&!c?'<button class="btn" data-nt="'+esc(r.id)+'">Email</button>':'')+(!c&&canClose?'<button class="btn pri" data-cl="'+esc(r.id)+'">Close request</button>':'')+(c&&canClose?'<button class="btn pri" data-ro="'+esc(r.id)+'">Open request</button>':'')+(canClose?'<button class="btn dng" data-rd="'+esc(r.id)+'">'+(rDel===r.id?'Confirm delete':'Delete request')+'</button>':'')+'</div>'+
  (canClose?'':'<p class="dim">Only an authorised user can close or delete requests.</p>'));
}
async function delReq(id){
  rDel='';
  var r=await sb.rpc('delete_request',{p_id:id});
  if(r.error){fail('Could not delete the request: '+r.error.message);return}
  removed[id]={at:today()};formOpen=false;$('#dr').classList.remove('open');drawAll();toast('Request deleted');
}
function mailText(o,mc){
  var p=(mc.parts&&mc.parts[o.step])||[],sv=o.step?o.step+' h service':'service to be decided';
  return {sub:'Maintenance needed: '+mc.tag+' ('+sv+')',body:'Machine: '+mc.tag+' ('+mc.type+', '+(mc.make+' '+mc.model).trim()+')\nSite: '+mc.site+'\nRequest '+o.no+': meters '+fmt(o.s)+' to '+fmt(o.e)+' ('+fmt(o.e-o.s)+' h)\nService needed: '+sv+'\n\nSpare parts to issue:\n'+(p.length?p.join('\n'):'Check the parts list for this service step.')};
}
function notify(o,mc){
  var m=mailText(o,mc),g=function(k){try{return localStorage.getItem('mb-'+k)||''}catch(e){return ''}};
  openForm('<div class="dh"><h2>Email the team</h2><button class="btn" id="fClose">Close</button></div><p class="dim">Request '+o.no+' needs maintenance. Check the addresses, then open the message in Outlook.</p>'+
  '<div class="grid"><label class="w">Maintenance team email(s)<input id="nTo" value="'+esc(g('to'))+'" placeholder="name@company.com; name2@company.com"></label>'+
  '<label class="w">Store email (spare parts)<input id="nSt" value="'+esc(g('store'))+'" placeholder="store@company.com"></label>'+
  '<label class="w">Subject<input id="nSub" value="'+esc(m.sub)+'"></label><label class="w">Message<textarea id="nBody" rows="9">'+esc(m.body)+'</textarea></label></div>'+
  '<div class="row" style="margin-top:12px"><a class="btn pri" id="nApp" href="#" target="_blank" rel="noopener" style="text-decoration:none">Outlook desktop app</a><button class="btn" id="nCopy">Copy message</button></div>');
}
function drawHome(){
  var v=$('#vHome');if(v.hidden)return;
  var over=items.filter(function(i){return status(i).s==='over'}).length,op=vreqs().filter(function(r){return !closedMap[r.id]}),due=op.filter(function(r){return r.due}).length,done=jobs.filter(jobVisible).length;
  var tile=function(t,n,l){return '<button class="tile" data-t="'+t+'"><b>'+n+'</b><span>'+l+'</span></button>'};
  v.innerHTML='<section class="hero"><h2>Keep every machine on its service schedule</h2><p>Track running hours, raise maintenance requests, and keep a clean record of every service and the spare parts changed.</p><div class="acts"><button class="btn pri" data-t="req">Maintenance requests</button><button class="btn" data-t="eq">Equipment</button></div></section><div class="stripe"></div><div class="tiles">'+tile('eq',items.length,'Machines')+tile('eq',over,'Overdue for service')+tile('req',due,'Open requests needing maintenance')+tile('req',op.length,'Open requests')+tile('log',done,'Services in the log')+'</div>';
}
function tagsList(){return '<datalist id="tags">'+items.map(function(i){return '<option value="'+esc(i.tag)+'">'}).join('')+'</datalist>'}
function openForm(h){sel=null;formOpen=true;var d=$('#dr');d.innerHTML=h;d.classList.add('open');var f=d.querySelector('input');if(f)f.focus()}
function jFill(src){
  var i=items.find(function(x){return x.tag===$('#jTag').value.trim()}),st=$('#jStep'),ta=$('#jParts');
  if(src==='tag'&&i){if(!$('#jHrs').dataset.u)$('#jHrs').value=i.hrs;if(!st.dataset.u&&i.interval===250)st.value=STEPS[(((Math.round((i.last+i.interval)/250)-1)%8)+8)%8]}
  if(i&&i.parts&&st.value&&!ta.dataset.u)ta.value=(i.parts[st.value]||[]).join('\n');
}
function jobForm(pre){
  pre=pre||{};var J=pre.job||null;jNo=J?J.no:nextNo(jobs);jReq=J?(J.reqId||''):(pre.reqId||'');jId=J?J.id:'';jPrev=J?J.status:'';
  openForm('<div class="dh"><h2>Job Order '+jNo+'</h2><button class="btn" id="fClose">Close</button></div>'+tagsList()+
  '<div class="grid" style="margin-top:12px"><label class="w">Machine tag<input id="jTag" list="tags" value="'+esc(pre.tag||'')+'"></label>'+
  '<label>Service step<select id="jStep"><option value="">Not a scheduled service</option>'+STEPS.map(function(s){return '<option value="'+s+'">'+s+' h service</option>'}).join('')+'</select></label>'+
  '<label>Hours at maintenance<input id="jHrs" type="number" min="0"></label><label>Date<input id="jDate" type="date" value="'+today()+'"></label><label>Done by<input id="jBy"></label>'+
  '<label class="w">Parts changed (one per line)<textarea id="jParts" rows="6"></textarea></label><label class="w">Notes<textarea id="jNotes" rows="2">'+esc(pre.notes||'')+'</textarea></label>'+
  '<input type="hidden" id="jSt" value="Done"><label class="w"><input type="checkbox" id="jLog" checked style="width:auto"> Also log it as a service on the machine (when a service step is chosen and the job is done)</label></div>'+
  '<div class="row" style="margin-top:12px"><button class="btn pri" id="jSave">Save and close request</button></div>');
  if(pre.tag)jFill('tag');
  if(pre.step){$('#jStep').value=pre.step;$('#jStep').dataset.u=1;jFill()}
  if(pre.hrs){$('#jHrs').value=pre.hrs;$('#jHrs').dataset.u=1}
  if(J){$('#jTag').value=J.tag;$('#jStep').value=J.step||'';$('#jStep').dataset.u=1;$('#jHrs').value=J.hrs;$('#jHrs').dataset.u=1;$('#jBy').value=J.by||'';$('#jParts').value=(J.parts||[]).join('\n');$('#jParts').dataset.u=1;$('#jNotes').value=J.notes||'';$('#jSt').value='Done'}
}
function saveJob(){
  var tag=val('#jTag'),i=items.find(function(x){return x.tag===tag});
  if(!i){toast('Pick a machine tag from the list');return}
  var step=num(val('#jStep')),h=num(val('#jHrs')),d=val('#jDate'),done=val('#jSt')==='Done',lg=$('#jLog').checked,rid=jReq,no=jNo,pv=jPrev;
  var o={id:jId||'jo'+Date.now(),no:no,tag:tag,type:i.type,step:step,hrs:h,date:d,by:val('#jBy'),parts:val('#jParts').split('\n').map(function(s){return s.trim()}).filter(Boolean),notes:val('#jNotes'),status:done?'Done':'Open',reqId:rid};
  putK('jobs',o).then(function(){
    var rq=reqs.find(function(x){return x.id===rid}),i2=Object.assign({},i,{hrs:Math.max(i.hrs,h,(rq&&rq.e)||0)});
    if(step&&done&&lg&&pv!=='Done'){i2.last=h;i2.hist=[{h:h,d:d,n:'Job Order '+no+' ('+step+' h service)'}].concat(i.hist)}
    put(fix(i2));
    var r=reqs.find(function(x){return x.id===rid});
    if(r&&r.job!==no)putK('reqs',Object.assign({},r,{job:no}));
    formOpen=false;$('#dr').classList.remove('open');toast('Job Order '+no+' saved.');if(rid)closeReq(rid);
  });
}
function sugStep(e){return STEPS[(((Math.floor(e/250)-1)%8)+8)%8]}
function rCalc(src){
  var i=items.find(function(x){return x.tag===$('#rTag').value.trim()}),S=$('#rS'),E=$('#rE'),c=$('#rCalc'),st=$('#rStep');
  if(src==='tag'&&i){if(!S.dataset.u)S.value=i.hrs}
  if(!E.value){c.innerHTML='';return}
  var e=num(E.value),d=e-num(S.value);
  if(d>=250){var g=sugStep(e);if(!st.dataset.u)st.value=g;c.innerHTML='<b style="color:var(--red)">Maintenance needed.</b> '+fmt(d)+' h since the start meter. Suggested service: '+g+' h (cycle '+(Math.floor((Math.floor(e/250)-1)/8)+1)+').'}
  else{if(!st.dataset.u)st.value='';c.innerHTML='<span class="dim">'+fmt(Math.max(d,0))+' h since the start meter. '+fmt(Math.max(250-d,0))+' h until maintenance is needed. The request will only be logged.</span>'}
}
function reqForm(){
  rNo=nextNo(reqs);
  openForm('<div class="dh"><h2>Request '+rNo+'</h2><button class="btn" id="fClose">Close</button></div>'+tagsList()+
  '<div class="grid" style="margin-top:12px"><label class="w">Machine tag<input id="rTag" list="tags"></label><label>Start meter (h)<input id="rS" type="number" min="0"></label><label>End meter (h)<input id="rE" type="number" min="0"></label><div class="w" id="rCalc" aria-live="polite"></div><label class="w">Service to do<select id="rStep"><option value="">No scheduled service</option>'+STEPS.map(function(s){return '<option value="'+s+'">'+s+' h service</option>'}).join('')+'</select></label><label class="w">What needs maintenance?<textarea id="rDesc" rows="3"></textarea></label>'+
  '<label>Priority<select id="rPri"><option>Normal</option><option>Low</option><option>High</option><option>Urgent</option></select></label><label>Requested by<input id="rBy"></label></div>'+
  '<div class="row" style="margin-top:12px"><button class="btn pri" id="rSave">Submit request</button></div>');
}
function saveReq(){
  var tag=val('#rTag'),desc=val('#rDesc');
  if(!items.some(function(x){return x.tag===tag})){toast('Pick a machine tag from the list');return}
  if(!desc&&!(num(val('#rE'))-num(val('#rS'))>=250)){toast('Describe what needs maintenance');return}
  var s=num(val('#rS')),e=num(val('#rE')),mc=items.find(function(x){return x.tag===tag}),due=e-s>=250;
  var o={id:'rq'+Date.now(),no:rNo,tag:tag,desc:desc||(due?'Scheduled service due':''),pri:val('#rPri'),by:val('#rBy'),date:today(),status:'Open',s:s,e:e,step:num(val('#rStep')),due:due};
  var jn=nextNo(jobs),stp=o.step,j={id:'jo'+Date.now(),no:jn,tag:tag,type:mc.type,step:stp,hrs:e,date:today(),by:'',parts:((mc.parts&&mc.parts[stp])||[]).slice(),notes:'Request '+o.no+': '+o.desc,status:'Open',reqId:o.id};
  if(!due){putK('reqs',o).then(function(){formOpen=false;$('#dr').classList.remove('open');toast('Request '+o.no+' logged. Under 250 h, so no maintenance was started.')});return}
  putK('reqs',o).then(function(){toast('Request '+o.no+' submitted. The hours now update when an administrator closes the request.');notify(o,mc)});
}
document.addEventListener('click',function(e){
  var t=e.target,id=t.id;
  if(t.closest&&t.closest('#logo'))setTab('home');
  else if(t.closest&&t.closest('[data-t]'))setTab(t.closest('[data-t]').dataset.t);
  else if(id==='lNew')jobForm();
  else if(id==='qNew')reqForm();
  else if(t.dataset&&t.dataset.mk){var r=reqs.find(function(x){return x.id===t.dataset.mk});if(r){var jb=jobs.find(function(x){return x.reqId===r.id});jobForm(jb?{job:jb}:{tag:r.tag,notes:'Request '+r.no+': '+r.desc,reqId:r.id,step:r.step,hrs:r.e})}}
  else if(t.dataset&&t.dataset.jo){var jb2=jobs.find(function(x){return x.id===t.dataset.jo});if(jb2)jobForm({job:jb2})}
  else if(t.dataset&&t.dataset.tag){var mi=items.find(function(x){return x.tag===t.dataset.tag});if(mi){formOpen=false;open(mi)}}
  else if(t.dataset&&t.dataset.cl)closeFlow(t.dataset.cl);
  else if(t.dataset&&t.dataset.nt){var nr=reqs.find(function(x){return x.id===t.dataset.nt}),nm=nr&&items.find(function(x){return x.tag===nr.tag});if(nm)notify(nr,nm)}
  else if(id==='nApp'){
    var tl=[$('#nTo').value,$('#nSt').value].join(';').split(/[;,\s]+/).filter(Boolean);
    if(!tl.length){e.preventDefault();toast('Enter the maintenance team and store email addresses first');return}
    try{localStorage.setItem('mb-to',$('#nTo').value.trim());localStorage.setItem('mb-store',$('#nSt').value.trim())}catch(e2){}
    var sj=encodeURIComponent($('#nSub').value),bd=encodeURIComponent($('#nBody').value.replace(/\n/g,'\r\n').slice(0,1500));
    t.href='mailto:'+tl.join(';%20')+'?subject='+sj+'&body='+bd}
  else if(id==='nCopy'){var ta=$('#nBody');ta.select();try{document.execCommand('copy');toast('Message copied')}catch(e){toast('Select the message and copy it')}}
  else if(id==='fClose'){formOpen=false;$('#dr').classList.remove('open')}
  else if(id==='jSave')saveJob();
  else if(id==='rSave')saveReq();
  else if(t.dataset&&t.dataset.ro)reopenReq(t.dataset.ro);
  else if(t.dataset&&t.dataset.rd){if(rDel===t.dataset.rd)delReq(t.dataset.rd);else{rDel=t.dataset.rd;reqView(t.dataset.rd)}}
  else if(t.closest&&t.closest('[data-rv]')){rDel='';reqView(t.closest('[data-rv]').dataset.rv)}
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='lq')drawLog();
  else if(id==='jTag')jFill('tag');
  else if(id==='jStep'){e.target.dataset.u=1;jFill()}
  else if(id==='jHrs'||id==='jParts')e.target.dataset.u=1;
  else if(id==='rTag')rCalc('tag');
  else if(id==='rS'||id==='rE'){e.target.dataset.u=1;rCalc()}
  else if(id==='rStep')e.target.dataset.u=1;
});

/* ---------- maintenance log export ---------- */
function exportLog(){
  var q=($('#lq')?$('#lq').value:'').toLowerCase();
  var rows=jobs.filter(function(j){return jobVisible(j)&&(!q||('job order '+j.no+' '+j.tag+' '+j.by+' '+(j.parts||[]).join(' ')).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return b.no-a.no});
  if(!rows.length){toast('No job orders to export');return}
  var qt=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
  var head=['Job order','Date','Machine tag','Equipment type','Service step (h)','Cycle','Hours at service','Parts changed','Requested by','Done by','Notes','Status'];
  var lines=[head.map(qt).join(',')].concat(rows.map(function(j){
    var rq=reqs.find(function(x){return x.id===j.reqId})||{};
    return ['Job Order '+j.no,j.date,j.tag,j.type,j.step||'',j.step?Math.max(1,Math.floor((Math.round(j.hrs/250)-1)/8)+1):'',j.hrs,(j.parts||[]).join('; '),rq.by||'',j.by,j.notes,j.status].map(qt).join(',')}));
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv'}));a.download='maintenance-log.csv';a.click();
}
document.addEventListener('click',function(e){if(e.target.id==='lExp')exportLog()});

/* ---------- users (admin only) ---------- */
var profiles=[];
async function loadUsers(){
  var r=await sb.from('profiles').select('id,email,role,created_at').order('created_at',{ascending:false});
  if(r.error){toast('Could not load users: '+r.error.message);return}
  profiles=r.data;
  var n=profiles.filter(function(p){return p.role==='pending'}).length;$('#tUsers').textContent='Users'+(n?' ('+n+')':'');
  drawUsers();
}
function drawUsers(){
  var v=$('#vUsers');if(v.hidden)return;
  var rank={pending:0,user:1,admin:2},list=profiles.slice().sort(function(a,b){return rank[a.role]-rank[b.role]||(a.email||'').localeCompare(b.email||'')});
  var btn=function(id,rl,label,pri){return '<button class="btn'+(pri?' pri':'')+'" data-ur="'+esc(id)+'" data-rl="'+rl+'">'+label+'</button> '};
  v.innerHTML='<p class="dim" style="margin:0 0 10px">New accounts wait here until you approve them. Approve gives normal access. Administrators can also close and delete requests, import data and approve users.</p><div class="tw"><table><thead><tr><th>Email</th><th>Joined</th><th>Role</th><th></th></tr></thead><tbody>'+
  (list.length?list.map(function(p){
    var me=p.id===booted,pc=p.role==='pending'?'soon':p.role==='user'?'ok':'';
    var act=me?'<span class="dim">This is you</span>':p.role==='pending'?btn(p.id,'user','Approve',1)+btn(p.id,'admin','Make admin'):p.role==='user'?btn(p.id,'admin','Make admin')+btn(p.id,'pending','Remove access'):btn(p.id,'user','Make regular user');
    return '<tr style="cursor:default"><td>'+esc(p.email)+'</td><td class="dim">'+esc((p.created_at||'').slice(0,10))+'</td><td><span class="pill '+pc+'"'+(p.role==='admin'?' style="background:var(--ink);color:var(--bg)"':'')+'>'+esc(p.role)+'</span></td><td>'+act+'</td></tr>'}).join(''):'<tr style="cursor:default"><td colspan="4" class="dim" style="padding:28px">No accounts yet.</td></tr>')+'</tbody></table></div>';
}
async function setRole(id,rl){
  if(id===booted)return;
  if(rl==='admin'&&!confirm('Make this person an administrator? They will be able to close and delete requests, import data and approve users.'))return;
  if(rl==='pending'&&!confirm('Remove access for this person?'))return;
  var r=await sb.from('profiles').update({role:rl}).eq('id',id).select();
  if(r.error||!r.data||!r.data.length){toast('Could not change the role: '+(r.error?r.error.message:'no permission'));return}
  toast('Role updated');loadUsers();
}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-ur]');if(b)setRole(b.dataset.ur,b.dataset.rl)});

/* ---------- start: sign in, then load ---------- */
function showAuth(m){$('#auth').hidden=false;$('#authMsg').textContent=m||'Use your company email and password.'}
async function boot(){
  var s=(await sb.auth.getSession()).data.session;
  if(!s){booted='';showAuth();return}
  if(booted===s.user.id)return;booted=s.user.id;
  var q=await sb.from('profiles').select('email,role').eq('id',s.user.id).maybeSingle();
  if(q.error){booted='';showAuth('Could not read your profile: '+q.error.message);return}
  if(!q.data){booted='';showAuth('No profile was found for this account. Ask an administrator to approve it.');return}
  var role=q.data.role;
  if(role==='pending'){booted='';showAuth('Your account is waiting for approval by an administrator. Try again later.');return}
  $('#auth').hidden=true;$('#authMsg').textContent='';canClose=role==='admin';if(!canClose){['#bAdd','#bImp','#bPar'].forEach(function(x){$(x).hidden=true})}if(role==='admin'){$('#tUsers').hidden=false;loadUsers()}
  $('#who').innerHTML=esc(s.user.email)+' ('+role+') <button class="btn" id="aOut">Sign out</button>';
  await loadAll();
  var t;sb.channel('mb').on('postgres_changes',{event:'*',schema:'public'},function(){clearTimeout(t);t=setTimeout(loadAll,400)}).subscribe();
}
document.addEventListener('click',async function(e){
  var id=e.target.id;
  if(id==='aIn'||id==='aUp'){
    var em=$('#aEmail').value.trim(),pw=$('#aPass').value;if(!em||!pw){showAuth('Enter your email and password.');return}
    var r=id==='aIn'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});
    if(r.error)showAuth(r.error.message);
    else if(id==='aUp'&&!r.data.session)showAuth('Account created. Check your email to confirm it, then sign in. An administrator must approve you before you can see the data.');
    else boot();
  }else if(id==='aOut'){await sb.auth.signOut();location.reload()}
});
drawAll();
if(!window.supabase||SUPABASE_KEY.indexOf('PASTE')===0){showAuth('Setup needed: paste your Supabase anon key near the top of the script (search for PASTE_YOUR_ANON_KEY).')}
else{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'||ev==='SIGNED_OUT')setTimeout(boot,0)})}
</script>
